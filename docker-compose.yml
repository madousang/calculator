version: '3'
services:
  calculator:
    build:
      context: .
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    networks:
      - app-network
    
  redis:
    image: redis:latest
    ports:
       - "6379:6379"     
    networks:
      - app-network

networks:
  app-network:
    driver: bridge